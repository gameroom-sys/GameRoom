<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAME ROOM | متجر الألعاب الإلكترونية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1033;--panel:#271a4a;--ink:#f6f1ff;--mute:#b9aedc;--pink:#ff5c8a;--gold:#ffd23f;--teal:#35e0c9;--line:#3d2d6b;--err:#ff8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.owner{background:linear-gradient(90deg,var(--bg),var(--panel),var(--bg));color:var(--gold);border-bottom:2px solid var(--line);text-shadow:0 0 8px rgba(255,210,63,.45);text-align:center;font-weight:900;font-size:1.05rem;letter-spacing:.03em;padding:4px 12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,48px);background:rgba(26,16,51,.94);border-bottom:2px solid var(--line)}
.logo{font-weight:900;font-size:1.6rem;letter-spacing:.04em;direction:ltr}
.logo b{color:var(--pink)}.logo i{font-style:normal;color:var(--gold)}
.logo{perspective:600px}
.logo-svg{height:92px;width:auto;display:block;transform-style:preserve-3d;filter:drop-shadow(2px 3px 0 #0a1f4a) drop-shadow(0 0 5px #22b8ff) drop-shadow(0 0 12px #ff4fd8);animation:logo3d 7s ease-in-out infinite alternate}
@keyframes logo3d{from{transform:rotateY(-14deg) rotateX(3deg);filter:drop-shadow(2px 3px 0 #0a1f4a) drop-shadow(0 0 4px #22b8ff) drop-shadow(0 0 10px #ff4fd8)}to{transform:rotateY(14deg) rotateX(-2deg);filter:drop-shadow(-2px 3px 0 #0a1f4a) drop-shadow(0 0 8px #22b8ff) drop-shadow(0 0 18px #ff4fd8)}}
@keyframes neon{0%,89%,93%,100%{opacity:1}91%{opacity:.6}95%{opacity:.8}}
@media (max-width:480px){.logo-svg{height:70px}}
.logo{position:relative}
.dragon{position:absolute;top:50%;left:50%;width:130px;height:auto;margin:-52px 0 0 -65px;z-index:0;pointer-events:none;filter:drop-shadow(0 0 10px rgba(61,220,151,.55));transform:translate(70px,-4px);animation:fly 12s ease-in-out infinite}
.logo-svg{position:relative;z-index:1}
@keyframes fly{0%{transform:translate(95px,-8px) rotate(-5deg) scaleX(1)}22%{transform:translate(20px,6px) rotate(4deg) scaleX(1)}45%{transform:translate(-95px,-4px) rotate(-3deg) scaleX(1)}50%{transform:translate(-95px,-4px) rotate(-3deg) scaleX(-1)}72%{transform:translate(-20px,8px) rotate(-4deg) scaleX(-1)}95%{transform:translate(95px,-8px) rotate(5deg) scaleX(-1)}100%{transform:translate(95px,-8px) rotate(-5deg) scaleX(1)}}
.dr-body{animation:dbob 1.4s ease-in-out infinite alternate}
@keyframes dbob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.dr-wing{transform-origin:90px 46px;animation:flap .7s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
.dr-fire{transform-origin:8px 52px;animation:fire .4s ease-in-out infinite alternate}
@keyframes fire{from{transform:scale(.6);opacity:.6}to{transform:scale(1.2);opacity:1}}
@media (max-width:480px){.dragon{width:96px;margin:-40px 0 0 -48px}}
.dragon3d{position:absolute;top:50%;left:50%;width:360px;height:150px;margin:-75px 0 0 -180px;z-index:2;pointer-events:none}
@media (max-width:480px){.dragon3d{width:250px;height:104px;margin:-52px 0 0 -125px}}
.tools{display:flex;align-items:center;gap:10px}.lang{display:flex;gap:4px}.lang button{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:0 10px;font-weight:700;font-size:.85rem}.lang button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2a1a00}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--gold);color:#2a1a00;border:0;border-radius:10px;padding:8px 16px;font-weight:700;box-shadow:0 4px 0 #b8901a}
.cartbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8901a}
.cartbtn span{background:#2a1a00;color:var(--gold);border-radius:999px;min-width:26px;text-align:center;padding:0 8px;font-size:.9rem}
.hero{padding:clamp(40px,8vw,88px) clamp(16px,4vw,48px) 32px;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.04) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.04) 31px 32px)}
.hero{position:relative;overflow:hidden}.hero>*{position:relative;z-index:1}
.hero>.bg3d{position:absolute;left:0;right:0;top:50%;z-index:0;margin:0;transform:perspective(900px) translateY(-50%) rotateX(20deg) rotateY(-16deg);text-align:center;direction:ltr;white-space:nowrap;font-weight:900;font-size:clamp(3rem,15vw,12rem);line-height:1;letter-spacing:.04em;color:#ffd23f;opacity:.45;animation:sway 7s ease-in-out infinite alternate;pointer-events:none;user-select:none;text-shadow:1px 1px 0 #e0ac1f,2px 2px 0 #d9a51c,3px 3px 0 #cf9b19,4px 4px 0 #c49116,5px 5px 0 #b98713,6px 6px 0 #ad7d11,7px 7px 0 #a1730f,8px 8px 0 #95690d,9px 9px 0 #895f0b,10px 10px 0 #7d5509,11px 11px 0 #714b08,12px 12px 0 #654207,24px 24px 24px rgba(0,0,0,.45)}
.cover img,.logo-svg,.scene .photo,.dragon,.dragon3d{will-change:transform}
.hero>.scene{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;overflow:hidden;pointer-events:none;perspective:700px}
.floor{position:absolute;left:-60%;right:-60%;bottom:-10%;height:70%;transform-origin:50% 100%;transform:rotateX(62deg);background-image:linear-gradient(rgba(53,224,201,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(255,92,138,.4) 2px,transparent 2px);background-size:60px 60px;animation:flow 1.6s linear infinite;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
@keyframes flow{to{background-position:0 60px}}
.cube{position:absolute;width:var(--s,56px);height:var(--s,56px);transform-style:preserve-3d;animation:spin 14s linear infinite,bob 5s ease-in-out infinite alternate}
.cube i{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(var(--s,56px)*.5);background:rgba(39,26,74,.85);border:2px solid var(--teal);border-radius:6px}
.cube i:nth-child(1){transform:translateZ(calc(var(--s,56px)/2))}
.cube i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s,56px)/2))}
.cube i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s,56px)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s,56px)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s,56px)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s,56px)/2))}
.c1{left:6%;top:18%;--s:64px}.c2{right:8%;top:12%;--s:48px;animation-delay:-4s,-2s}.c3{left:30%;top:58%;--s:40px;animation-delay:-8s,-1s}.c4{right:28%;top:52%;--s:56px;animation-delay:-2s,-3s}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes bob{from{margin-top:0}to{margin-top:-24px}}
.scene svg{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:50% 100%;animation:cam 16s ease-in-out infinite alternate}

@keyframes kb{from{transform:scale(1.05) translateX(-1.5%)}to{transform:scale(1.2) translateX(1.5%)}}
.scene canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(26,16,51,.7),rgba(26,16,51,.25) 45%,rgba(26,16,51,.75))}
@keyframes cam{from{transform:scale(1.05) translateX(-2%)}to{transform:scale(1.2) translateX(2%)}}
@keyframes scr{0%{fill:#35e0c9}25%{fill:#ff5c8a}50%{fill:#ffd23f}75%{fill:#7b2ff7}100%{fill:#35e0c9}}
.scr{animation:scr 4s linear infinite}
@keyframes blink{50%{opacity:.15}}
.blink{animation:blink 1.2s steps(2) infinite}
@keyframes pulse{from{opacity:.25}to{opacity:.8}}
.pulse{animation:pulse 2.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:perspective(900px) translateY(-56%) rotateX(24deg) rotateY(-30deg)}to{transform:perspective(900px) translateY(-44%) rotateX(14deg) rotateY(18deg)}}
.hero h1{margin:0 0 8px;font-weight:900;font-size:clamp(2.4rem,8vw,4.6rem);line-height:1.15;text-shadow:4px 4px 0 var(--pink)}
.hero p{margin:0 0 24px;color:var(--mute);font-size:1.15rem;max-width:36rem}
.search{width:100%;max-width:520px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.search::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px clamp(16px,4vw,48px) 24px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 18px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#06302b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:0 clamp(16px,4vw,48px) 56px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cover{perspective:700px;height:190px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative}
@keyframes tilt{from{transform:rotateY(-26deg) rotateX(6deg) translateY(0)}to{transform:rotateY(26deg) rotateX(-4deg) translateY(-6px)}}
.cover img{height:100%;width:auto;max-width:100%;transform-style:preserve-3d;animation:tilt 4.5s ease-in-out infinite alternate;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}
.card:nth-child(2n) .cover img{animation-delay:-1.5s}.card:nth-child(3n) .cover img{animation-delay:-3s}
.card:hover .cover img{animation:none;transform:scale(1.1)}
.card .cover.burn img{animation:charr 2.6s ease-in both}
@keyframes charr{0%{filter:none}30%{filter:sepia(1) saturate(4) brightness(1.4) hue-rotate(-15deg)}65%{filter:sepia(1) brightness(.45) contrast(1.2)}85%{filter:brightness(.3) grayscale(.6)}100%{filter:none}}
.cover.burn::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;transform-origin:50% 100%;background:radial-gradient(circle at 50% 120%,rgba(0,0,0,.85) 0,rgba(90,20,0,.7) 35%,transparent 65%);animation:scorch 2.6s ease-out both}
@keyframes scorch{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.3)}}
.fire{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
.fire i{position:absolute;bottom:-20%;width:26%;height:var(--h,70%);background:radial-gradient(ellipse at 50% 85%,#fff3a0 0,#ffb300 30%,#ff5a00 60%,rgba(255,40,0,0) 75%);border-radius:50% 50% 45% 45%/70% 70% 30% 30%;filter:blur(2px);transform-origin:50% 100%;mix-blend-mode:screen;animation:flame .5s ease-in-out infinite alternate,glow 2.6s ease-out both}
@keyframes flame{from{transform:scale(.8,.9) skewX(-6deg)}to{transform:scale(1.1,1.15) skewX(6deg)}}
@keyframes glow{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}.th img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:rgba(26,16,51,.85);border-radius:6px;padding:0 10px;font-size:.8rem;font-weight:700;direction:ltr}
.info{padding:14px;display:flex;flex-direction:column;gap:2px;flex:1}
.info h3{margin:0;font-size:1.15rem}
.info small{color:var(--mute)}
.buy{flex-wrap:wrap;gap:8px;display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.price{font-weight:900;color:var(--gold);font-size:1.2rem}
.add{background:var(--pink);border:0;border-radius:8px;padding:6px 14px;font-weight:700;color:#2a0614}
.wa-btn{display:block;margin-top:8px;text-align:center;background:#25d366;color:#052e16;border-radius:8px;padding:6px;font-weight:700;text-decoration:none}
.wa{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;z-index:25;width:54px;height:54px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
a.add{display:inline-block;text-decoration:none}.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:360px;background:var(--gold);color:#2a1a00;border-radius:10px;padding:10px 16px;font-weight:700;text-align:center;z-index:50;opacity:0;visibility:hidden;transition:opacity .2s}.toast.on{opacity:1;visibility:visible}
.add:hover{filter:brightness(1.1)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
footer{border-top:2px solid var(--line);padding:24px;text-align:center;color:var(--mute);font-size:.9rem}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;visibility:hidden;transition:opacity .2s}
.shade.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:#20143f;z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(-105%);visibility:hidden;transition:transform .25s,visibility .25s;border-right:2px solid var(--line)}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--line)}
.dh h2{margin:0;font-size:1.3rem}
.x{background:none;border:0;font-size:1.6rem;line-height:1;padding:4px 10px}
.lines{flex:1;overflow-y:auto;padding:12px 18px}
.line{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .th{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.line b{display:block}.line small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:6px;border:2px solid var(--line);background:var(--panel);padding:0;line-height:1}
.qty button.del{border-color:var(--pink)}
.foot{padding:14px 18px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:1.2rem}
.tot span:last-child{color:var(--gold)}
.foot input,.foot select{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 12px;width:100%}
.err{color:var(--err);min-height:1.4em;margin:0;font-size:.9rem}
.go{background:var(--teal);color:#06302b;border:0;border-radius:10px;padding:10px;font-weight:900;box-shadow:0 4px 0 #1b9f90}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #1b9f90}
.done{padding:40px 24px;text-align:center;display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.done .big{font-size:3.5rem}
.drawer.fin .lines,.drawer.fin .foot{display:none}
.drawer.fin .done{display:flex}
.drawer.none .foot{display:none}
.none-msg{color:var(--mute);text-align:center;padding:40px 0}
@media (max-width:480px){.logo{font-size:1.15rem}.cartbtn{padding:6px 10px}.top{gap:8px}.lang button{padding:0 7px}}

</style>
</head>

    $("ph").placeholder = T("ph");
    $("ph").setAttribute("aria-label", T("ph"));
    $("order").textContent = T("order");
    $("dl").options[0].text = T("dd");
    $("dl").options[1].text = T("dp");
    document.querySelector("#done h2").textContent = T("done");
    $("again").textContent = T("again");
    document.querySelector(".owner").textContent = T("owner");
    $("waFl").setAttribute("aria-label", T("wab"));
    $("err").textContent = "";
    Array.prototype.forEach.call(document.querySelectorAll("#lang button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === l));
    });
    renderChips();
    renderGrid();
    renderCart();
  }
  $("lang").addEventListener("click", function (e) {
    var b = e.target.closest("[data-l]");
    if (b) setLang(b.getAttribute("data-l"));
  });
  dragon3d();
  setLang("ar");
})();
</script>
</body>
</html>
